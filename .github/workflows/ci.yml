name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set registry URL
        run: echo "LATTICE_REGISTRY_URL=https://$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]').github.io/${{ github.event.repository.name }}/r" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Simulation tests
        run: pnpm test

      - name: Registry drift
        if: github.repository == 'Anilams/lattice-ui'
        run: |
          pnpm registry
          git diff --exit-code -- public/r registry.json

      - name: Build app
        run: pnpm build

      - name: Build library
        run: pnpm build:lib
